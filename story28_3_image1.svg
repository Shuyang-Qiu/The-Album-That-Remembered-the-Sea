<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Noctero in the Album</title>
  <desc id="desc">A small owl-like shadow creature perched on a glowing album page.</desc>
  <defs>
