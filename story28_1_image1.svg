<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Old Photo Album</title>
  <desc id="desc">A glowing old photo album with moving pages and ocean light.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2536"/>
      <stop offset="100%" stop-color="#08131d"/>
    </linearGradient>
    <linearGradient id="album" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a6543"/>
      <stop offset="100%" stop-color="#4f3523"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9ef3ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8ab0ff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="650" fill="url(#bg)"/>
  <circle cx="930" cy="110" r="170" fill="#7ed9ff" opacity="0.09"/>
  <circle cx="170" cy="510" r="140" fill="#93ffd5" opacity="0.07"/>
  <g transform="translate(220 110)">
    <rect x="0" y="80" rx="18" ry="18" width="760" height="340" fill="#352114" opacity="0.55"/>
    <rect x="50" y="40" rx="16" ry="16" width="350" height="380" fill="url(#album)"/>
    <rect x="400" y="40" rx="16" ry="16" width="350" height="380" fill="#e8dcc4"/>
    <rect x="448" y="90" width="254" height="200" rx="10" fill="#c8e9f2" opacity="0.55"/>
    <rect x="448" y="305" width="200" height="56" rx="8" fill="#f7f0e5" opacity="0.95"/>
    <line x1="401" y1="44" x2="401" y2="415" stroke="#714729" stroke-width="8"/>
    <rect x="100" y="120" width="250" height="220" rx="10" fill="#122238" opacity="0.5"/>
    <path d="M470 245 C540 190, 620 140, 700 110" stroke="#75eeff" stroke-width="6" fill="none" opacity="0.7"/>
    <path d="M470 258 C530 215, 603 170, 680 145" stroke="#b1ffd8" stroke-width="3" fill="none" opacity="0.7"/>
    <circle cx="690" cy="110" r="18" fill="#92f0ff"/>
    <circle cx="690" cy="110" r="7" fill="#082030"/>
  </g>
  <rect x="0" y="0" width="1200" height="650" fill="url(#light)" opacity="0.55"/>
