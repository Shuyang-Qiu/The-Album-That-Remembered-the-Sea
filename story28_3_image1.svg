      <stop offset="100%" stop-color="#05080d"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#b6f6ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#b6f6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="650" fill="url(#bg)"/>
  <circle cx="600" cy="310" r="220" fill="url(#moon)"/>
  <rect x="220" y="390" width="760" height="150" rx="20" fill="#1b2238"/>
  <rect x="250" y="420" width="700" height="92" rx="14" fill="#e7e4db" opacity="0.92"/>
